name: Publicize Prerelease
on:
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Version or milestone to publicize (e.g. 4.2.0-M1, 4.2.0-RC1). Leave blank to read from gradle.properties'
        required: false
        default: ''
  push:
    tags:
      - 'v4.2.0-M[1-9]'
      - 'v4.2.0-RC[1-9]'
      - 'v*-M*'
      - 'v*-RC*'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  read-version:
    name: Read Version
    runs-on: 'ubuntu-latest'
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Version From gradle.properties
        id: read-version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.milestone }}" ]; then
            version="${{ github.event.inputs.milestone }}"
          else
            version=$(sed -n 's/version=\(.*\)/\1/p' gradle.properties)
          fi
          echo "Version is $version"
          echo "version=$version" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.read-version.outputs.version }}
  publish-gradle-plugin:
    name: Publish Gradle Plugin
    if: ${{ vars.ENABLE_PUBLISH_GRADLE_PLUGIN == 'true' }}
    needs:
      - read-version
    runs-on: 'ubuntu-latest'
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish
        uses: ./.github/actions/publish-gradle-plugin
        with:
          build-number: '2026.4'
          gradle-plugin-publish-key: ${{ secrets.GRADLE_PLUGIN_PUBLISH_KEY }}
          gradle-plugin-publish-secret: ${{ secrets.GRADLE_PLUGIN_PUBLISH_SECRET }}
          jfrog-cli-config-token: ${{ secrets.JF_ARTIFACTORY_SPRING }}
          plugin-version: ${{ needs.read-version.outputs.version }}
  trigger-docs-build:
    name: Trigger Docs Build
    if: ${{ vars.TRIGGER_DOCS_BUILD == 'true' || github.repository == 'spring-projects/spring-boot' }}
    needs:
      - read-version
    permissions:
      actions: write
    runs-on: 'ubuntu-latest'
    steps:
      - name: Run Deploy Docs Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-docs.yml --repo ${{ github.repository }} -r docs-build -f build-refname=${{ github.ref_name }} -f build-version=${{ needs.read-version.outputs.version }}
  create-github-release:
    name: Create GitHub Release
    needs:
      - read-version
      - publish-gradle-plugin
      - trigger-docs-build
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: write
      issues: write
    runs-on: 'ubuntu-latest'
    steps:
      - name: Check Out Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ensure Git Tag Exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.read-version.outputs.version }}"
          tag="v${version}"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag not found locally or on remote. Creating tag $tag..."
            git tag "$tag"
            git push origin "$tag" || true
          else
            echo "Tag $tag already exists."
          fi
      - name: Ensure GitHub Milestone Exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          milestone="${{ needs.read-version.outputs.version }}"
          echo "Ensuring GitHub milestone exists for: $milestone"
          gh api "repos/${{ github.repository }}/milestones" -f title="$milestone" -f state="open" || true
      - name: Create GitHub Release
        uses: ./.github/actions/create-github-release
        with:
          commercial: ${{ vars.COMMERCIAL || false }}
          pre-release: true
          milestone: ${{ needs.read-version.outputs.version }}
          token: ${{ secrets.GH_ACTIONS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
