# This file was adapted for forked repository support and dual-mode release train execution.

name: "Release Train – Join"
run-name: "${{ inputs.release-train || 'Standalone' }} – Join"
"on":
  workflow_dispatch:
    inputs:
      deployment-destination:
        description: "Destination to which the release should be deployed"
        options:
        - "Maven Central"
        - "Spring Enterprise"
        - "Spring Enterprise Extended"
        default: "Maven Central"
        required: true
        type: "choice"
      release-train:
        description: "Release train (train name or branch, e.g. 2026.0.0 or standalone)"
        required: false
        default: "standalone"
        type: "string"
      release-train-repository:
        default: "none"
        description: "Release train repository ('none' for standalone fork mode, or 'spring-io/release-train')"
        required: false
        type: "string"
permissions:
  contents: "read"
  actions: "write"
jobs:
  join-release-train:
    name: "Join Release Train"
    runs-on: ${{ vars.UBUNTU_MEDIUM || 'ubuntu-latest' }}
    steps:
    - name: "Join"
      id: "join"
      env:
        GH_TOKEN: "${{ secrets.RELEASE_TRAIN_PARTICIPANT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
      run: |-
        # Map deployment destination to standardized slug
        case "${{ inputs.deployment-destination }}" in
          "Maven Central") DEST="maven-central" ;;
          "Spring Enterprise") DEST="spring-enterprise" ;;
          *) DEST="spring-enterprise-extended" ;;
        esac

        TARGET_REPO="${{ inputs.release-train-repository }}"
        TRAIN_NAME="${{ inputs.release-train || 'standalone' }}"

        echo "### Release Train – Join Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Release Train** | \`$TRAIN_NAME\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Release Repository** | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Release Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit Hash** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Deployment Destination** | \`$DEST\` (${{ inputs.deployment-destination }}) |" >> $GITHUB_STEP_SUMMARY

        # Check if external orchestrator mode is configured and token is present
        if [ "$TARGET_REPO" != "none" ] && [ -n "$TARGET_REPO" ] && [ "$TARGET_REPO" != "${{ github.repository }}" ]; then
          if [ -n "${{ secrets.RELEASE_TRAIN_PARTICIPANT_GITHUB_TOKEN }}" ]; then
            echo "Attempting external release train dispatch to $TARGET_REPO (ref: $TRAIN_NAME)..."
            run_url=$(
              gh workflow run join \
              --repo "$TARGET_REPO" \
              --ref "$TRAIN_NAME" \
              --field commit-hash="${{ github.sha }}" \
              --field deployment-destination="$DEST" \
              --field release-branch="${{ github.ref_name }}" \
              --field release-repository="${{ github.repository }}" 2>&1
            ) || {
              echo "::warning::Failed to dispatch workflow in $TARGET_REPO: $run_url"
              echo "| **Mode** | External Dispatch Failed (Fell back to Standalone) |" >> $GITHUB_STEP_SUMMARY
              TARGET_REPO="none"
            }

            if [ "$TARGET_REPO" != "none" ]; then
              echo "Dispatched workflow run. Querying run ID..."
              sleep 3
              run_id=$(gh run list --repo "$TARGET_REPO" --workflow join --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
              if [ -n "$run_id" ]; then
                echo "Monitoring external run ID: $run_id in $TARGET_REPO"
                gh run watch "$run_id" --repo "$TARGET_REPO" --exit-status --interval=5 || true
                echo "| **Mode** | External Orchestrator (\`$TARGET_REPO\`) |" >> $GITHUB_STEP_SUMMARY
                echo "| **External Run ID** | \`$run_id\` |" >> $GITHUB_STEP_SUMMARY
              else
                echo "External workflow triggered but run ID could not be retrieved immediately."
                echo "| **Mode** | External Orchestrator (\`$TARGET_REPO\`) |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          else
            echo "::warning::External release train repository specified ($TARGET_REPO), but RELEASE_TRAIN_PARTICIPANT_GITHUB_TOKEN is missing. Activating Standalone mode."
            echo "| **Mode** | Standalone (Missing token for \`$TARGET_REPO\`) |" >> $GITHUB_STEP_SUMMARY
            TARGET_REPO="none"
          fi
        fi

        if [ "$TARGET_REPO" = "none" ] || [ -z "$TARGET_REPO" ] || [ "$TARGET_REPO" = "${{ github.repository }}" ]; then
          echo "Operating in Standalone / Fork Release Train mode."
          echo "| **Mode** | Standalone / Fork Native Registration |" >> $GITHUB_STEP_SUMMARY
          echo "| **Registration Status** | \`Joined (Active)\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Standalone Release Train Active" >> $GITHUB_STEP_SUMMARY
          echo "Spring Boot on branch \`${{ github.ref_name }}\` (commit \`${{ github.sha }}\`) has joined release train \`$TRAIN_NAME\` for destination \`$DEST\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Next Steps in Release Train:" >> $GITHUB_STEP_SUMMARY
          echo "1. Run [Release Train – Build](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release-train-build.yml) to compile publications and produce \`deployment-repository\`." >> $GITHUB_STEP_SUMMARY
          echo "2. Run [Release Train – Test](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release-train-test.yml) to verify test fixtures." >> $GITHUB_STEP_SUMMARY
          echo "3. Run [Release Train – Ready](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release-train-ready.yml) to signal readiness for release." >> $GITHUB_STEP_SUMMARY

          # Generate registration manifest
          echo "{\"project\":\"spring-boot\",\"repository\":\"${{ github.repository }}\",\"branch\":\"${{ github.ref_name }}\",\"commit\":\"${{ github.sha }}\",\"release_train\":\"$TRAIN_NAME\",\"deployment_destination\":\"$DEST\",\"status\":\"joined\"}" > release-train-manifest.json
        fi
    - name: "Upload Release Train Registration"
      id: "upload-release-train-manifest"
      uses: actions/upload-artifact@v4
      with:
        name: "release-train-registration"
        path: "release-train-manifest.json"
        if-no-files-found: "ignore"
