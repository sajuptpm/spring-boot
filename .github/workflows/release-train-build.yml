# This file was adapted for forked repository support and dual-mode release train execution.

name: "Release Train – Build"
run-name: "${{ inputs.callback-ref || 'Manual' }} – Build"
"on":
  workflow_dispatch:
    inputs:
      callback:
        description: "Repository to which a callback should be made upon completion ('none' for standalone mode)"
        required: false
        default: "none"
        type: "string"
      callback-ref:
        description: "Ref in the callback repository to which a callback should be made upon completion"
        required: false
        default: "main"
        type: "string"
      release-train-maven-repository-url:
        description: "URL of a Maven repository to be used to resolve artifacts of projects earlier in the train"
        required: false
        default: ""
        type: "string"
      repeat-build:
        description: "Perform a repeated build to verify build reproducibility (set false for fast single build)"
        required: false
        default: false
        type: boolean
permissions:
  contents: "read"
  actions: "write"
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
jobs:
  build-release:
    name: "Build Release"
    runs-on: ${{ vars.UBUNTU_MEDIUM || 'ubuntu-latest' }}
    steps:
    - name: "Prevent Re-runs"
      id: "prevent-re-runs"
      run: |-
        if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
          if [ "${{ vars.RELEASE_TRAIN_ALLOW_RERUNS }}" = "true" ] || [ "${{ inputs.callback }}" = "none" ] || [ -z "${{ inputs.callback }}" ]; then
            echo "Re-runs allowed in standalone / configured mode (run attempt: $GITHUB_RUN_ATTEMPT)."
          else
            echo "Re-runs are prohibited. Use the 'Release Train – Retry' workflow to retry build failures"
            exit 1
          fi
        fi
    - name: "Set up Java"
      id: "set-up-java"
      uses: "actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6" # v6.0.1
      with:
        distribution: "liberica"
        java-version: "25"
    - name: "Check Out Code"
      id: "check-out-code"
      uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
    - name: "Build Release"
      id: "build-release"
      uses: "./.github/actions/release-train-build"
      env:
        COMMERCIAL_RELEASE_REPO_URL: "${{ vars.COMMERCIAL_RELEASE_REPO_URL }}"
        COMMERCIAL_REPO_PASSWORD: "${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}"
        COMMERCIAL_REPO_USERNAME: "${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}"
        RELEASE_TRAIN_MAVEN_REPOSITORY_PASSWORD: "${{ secrets.RELEASE_TRAIN_PARTICIPANT_MAVEN_REPOSITORY_PASSWORD }}"
        RELEASE_TRAIN_MAVEN_REPOSITORY_URL: "${{ inputs.release-train-maven-repository-url }}"
        RELEASE_TRAIN_MAVEN_REPOSITORY_USERNAME: "${{ secrets.RELEASE_TRAIN_PARTICIPANT_MAVEN_REPOSITORY_USERNAME }}"
        GRADLE_ENTERPRISE_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY }}"
    - name: "Record Build Info"
      id: "record-build-info"
      run: |-
        echo \
        '{"javaVersions":["${{ steps.set-up-java.outputs.version }}"],"javaDistribution":"liberica"}' \
        > build-info.json
    - name: "Upload Build Info"
      id: "upload-build-info"
      uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
      with:
        archive: "false"
        path: "build-info.json"
    - name: "Upload Deployment Repository"
      id: "upload-deployment-repository"
      uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
      with:
        name: "deployment-repository"
        path: "deployment-repository/**"
    - name: "Upload Deployment Spec"
      id: "upload-deployment-spec"
      uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
      with:
        archive: "false"
        if-no-files-found: "ignore"
        name: "deployment-spec"
        path: ".github/actions/release-train-build/deployment-spec.yml"
    - name: "Clean Artifacts from Build Release"
      id: "clean-artifacts-from-build-release"
      if: ${{ inputs.repeat-build == true || inputs.repeat-build == 'true' || vars.RELEASE_TRAIN_REPEAT_BUILD == 'true' }}
      run: |-
        git reset --hard
        git clean -ffdx
        pkill -f GradleDaemon || true
        caches="${GRADLE_USER_HOME:-$HOME/.gradle}/caches"
        if [ -d "$caches" ]; then
          find "$caches" -mindepth 1 -maxdepth 1 ! -name 'modules-*' -exec rm -rf {} +
        fi
    - name: "Repeat Build"
      id: "repeat-build"
      if: ${{ inputs.repeat-build == true || inputs.repeat-build == 'true' || vars.RELEASE_TRAIN_REPEAT_BUILD == 'true' }}
      uses: "./.github/actions/release-train-build"
      env:
        COMMERCIAL_RELEASE_REPO_URL: "${{ vars.COMMERCIAL_RELEASE_REPO_URL }}"
        COMMERCIAL_REPO_PASSWORD: "${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}"
        COMMERCIAL_REPO_USERNAME: "${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}"
        RELEASE_TRAIN_MAVEN_REPOSITORY_PASSWORD: "${{ secrets.RELEASE_TRAIN_PARTICIPANT_MAVEN_REPOSITORY_PASSWORD }}"
        RELEASE_TRAIN_MAVEN_REPOSITORY_URL: "${{ inputs.release-train-maven-repository-url }}"
        RELEASE_TRAIN_MAVEN_REPOSITORY_USERNAME: "${{ secrets.RELEASE_TRAIN_PARTICIPANT_MAVEN_REPOSITORY_USERNAME }}"
        GRADLE_ENTERPRISE_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY }}"
    - name: "Upload Repeated Build Repository"
      id: "upload-repeated-build-repository"
      uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
      with:
        name: "repeated-build-repository"
        path: "deployment-repository/**"
    - name: "Save Build System Caches"
      id: "save-build-system-caches"
      uses: "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
      with:
        key: "release-train-${{ inputs.callback-ref || 'manual' }}-${{ github.ref_name }}-${{ github.run_id }}"
        path: |-
          ~/.gradle/caches
          ~/.gradle/wrapper
    - name: "Send Callback"
      id: "send-callback"
      if: "${{ always() }}"
      env:
        GH_TOKEN: "${{ secrets.RELEASE_TRAIN_PARTICIPANT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
      run: |-
        echo "### Release Train – Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Attribute | Value |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Result** | \`${{ job.status == 'success' && 'built' || 'build-failed' }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit Hash** | \`${{ steps.check-out-code.outputs.commit }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Release Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Repository** | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Deployment Repository Artifact ID** | \`${{ steps.upload-deployment-repository.outputs.artifact-id }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Deployment Spec Artifact ID** | \`${{ steps.upload-deployment-spec.outputs.artifact-id }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Repeated Build Artifact ID** | \`${{ steps.upload-repeated-build-repository.outputs.artifact-id }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Workflow Run URL** | [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        CALLBACK_REPO="${{ inputs.callback }}"
        if [ -n "$CALLBACK_REPO" ] && [ "$CALLBACK_REPO" != "none" ]; then
          if [ -n "$GH_TOKEN" ]; then
            echo "Dispatching callback to $CALLBACK_REPO (ref: ${{ inputs.callback-ref }})..."
            gh workflow run callback \
              --repo "$CALLBACK_REPO" \
              --ref "${{ inputs.callback-ref }}" \
              --field commit-hash="${{ steps.check-out-code.outputs.commit }}" \
              --field deployment-repository-artifact-identifier="${{ steps.upload-deployment-repository.outputs.artifact-id }}" \
              --field deployment-spec-artifact-identifier="${{ steps.upload-deployment-spec.outputs.artifact-id }}" \
              --field release-branch="${{ github.ref_name }}" \
              --field release-repository="${{ github.repository }}" \
              --field repeated-build-repository-artifact-identifier="${{ steps.upload-repeated-build-repository.outputs.artifact-id }}" \
              --field result="${{ job.status == 'success' && 'built' || 'build-failed' }}" \
              --field workflow-run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Callback dispatched successfully."
            echo "#### Callback Status: Dispatched" >> $GITHUB_STEP_SUMMARY
            echo "Dispatched callback to repository \`$CALLBACK_REPO\` on ref \`${{ inputs.callback-ref }}\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Callback repository configured ($CALLBACK_REPO), but GH_TOKEN / RELEASE_TRAIN_PARTICIPANT_GITHUB_TOKEN is missing. Skipping external dispatch."
            echo "#### Callback Status: Skipped" >> $GITHUB_STEP_SUMMARY
            echo "External callback target: \`$CALLBACK_REPO\`. Token not provided." >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "Standalone mode: No callback repository configured (callback='$CALLBACK_REPO')."
          echo "#### Standalone Mode Active" >> $GITHUB_STEP_SUMMARY
          echo "Build artifacts are preserved and downloadable directly from GitHub Actions." >> $GITHUB_STEP_SUMMARY
        fi
