# This file was adapted for forked repository support and dual-mode release train execution.

name: "Release Train – Test"
run-name: "${{ inputs.callback-ref || 'Manual' }} – Test"
"on":
  workflow_dispatch:
    inputs:
      callback:
        description: "Repository to which a callback should be made upon completion ('none' for standalone mode)"
        required: false
        default: "none"
        type: "string"
      callback-ref:
        description: "Ref in the callback repository to which a callback should be made upon completion"
        required: false
        default: "main"
        type: "string"
      release-train-maven-repository-url:
        description: "URL of a Maven repository to be used to resolve artifacts of projects earlier in the train"
        required: false
        default: ""
        type: "string"
      test-scope:
        description: "Scope of release train tests ('core', 'smoke', or 'full')"
        required: false
        default: "core"
        type: "choice"
        options:
        - "core"
        - "smoke"
        - "full"
permissions:
  contents: "read"
  actions: "write"
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
jobs:
  test-release:
    name: "Test Release"
    runs-on: ${{ vars.UBUNTU_LARGE || vars.UBUNTU_MEDIUM || 'ubuntu-latest' }}
    steps:
    - name: "Prevent Re-runs"
      id: "prevent-re-runs"
      run: |-
        if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
          if [ "${{ vars.RELEASE_TRAIN_ALLOW_RERUNS }}" = "true" ] || [ "${{ inputs.callback }}" = "none" ] || [ -z "${{ inputs.callback }}" ]; then
            echo "Re-runs allowed in standalone / configured mode (run attempt: $GITHUB_RUN_ATTEMPT)."
          else
            echo "Re-runs are prohibited. Use the 'Release Train – Retry' workflow to retry test failures"
            exit 1
          fi
        fi
    - name: "Free Disk Space"
      id: "free-disk-space"
      if: "${{ runner.os == 'Linux' }}"
      uses: "jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6" # v2.0.0
      with:
        docker-images: "false"
        preinstalled-runtimes: "true"
    - name: "Set up Java"
      id: "set-up-java"
      uses: "actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6" # v6.0.1
      with:
        distribution: "liberica"
        java-version: "25"
    - name: "Check Out Code"
      id: "check-out-code"
      uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
    - name: "Restore Build System Caches"
      id: "restore-build-system-caches"
      uses: "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
      with:
        key: "release-train-${{ inputs.callback-ref || 'manual' }}-${{ github.ref_name }}-${{ github.run_id }}"
        restore-keys: |-
          release-train-${{ inputs.callback-ref || 'manual' }}-${{ github.ref_name }}
          release-train-
        path: |-
          ~/.gradle/caches
          ~/.gradle/wrapper
    - name: "Resolve Test Tasks"
      id: "resolve-tasks"
      run: |-
        SCOPE="${{ inputs.test-scope || vars.RELEASE_TRAIN_TEST_SCOPE || 'core' }}"
        case "$SCOPE" in
          "full")
            TASKS="build -x dockerTest -x reclaimDockerSpace -x antora"
            ;;
          "smoke")
            TASKS=":smoke-test:spring-boot-smoke-test-simple:test"
            ;;
          *)
            TASKS=":core:spring-boot:test :smoke-test:spring-boot-smoke-test-simple:test -x antora"
            ;;
        esac
        echo "Resolved tasks for scope '$SCOPE': $TASKS"
        echo "tasks=$TASKS" >> $GITHUB_OUTPUT
    - name: "Test Release"
      id: "test-release"
      uses: "./.github/actions/release-train-test"
      with:
        test-tasks: "${{ steps.resolve-tasks.outputs.tasks }}"
      env:
        COMMERCIAL_RELEASE_REPO_URL: "${{ vars.COMMERCIAL_RELEASE_REPO_URL }}"
        COMMERCIAL_REPO_PASSWORD: "${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}"
        COMMERCIAL_REPO_USERNAME: "${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}"
        RELEASE_TRAIN_MAVEN_REPOSITORY_PASSWORD: "${{ secrets.RELEASE_TRAIN_PARTICIPANT_MAVEN_REPOSITORY_PASSWORD }}"
        RELEASE_TRAIN_MAVEN_REPOSITORY_URL: "${{ inputs.release-train-maven-repository-url }}"
        RELEASE_TRAIN_MAVEN_REPOSITORY_USERNAME: "${{ secrets.RELEASE_TRAIN_PARTICIPANT_MAVEN_REPOSITORY_USERNAME }}"
        GRADLE_ENTERPRISE_ACCESS_KEY: "${{ secrets.DEVELOCITY_ACCESS_KEY }}"
    - name: "Send Callback"
      id: "send-callback"
      if: "${{ always() }}"
      env:
        GH_TOKEN: "${{ secrets.RELEASE_TRAIN_PARTICIPANT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
      run: |-
        echo "### Release Train – Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Attribute | Value |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Result** | \`${{ job.status == 'success' && 'tested' || 'test-failed' }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit Hash** | \`${{ steps.check-out-code.outputs.commit }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Release Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Repository** | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Test Scope** | \`${{ inputs.test-scope || 'core' }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Executed Tasks** | \`${{ steps.resolve-tasks.outputs.tasks }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Workflow Run URL** | [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        CALLBACK_REPO="${{ inputs.callback }}"
        if [ -n "$CALLBACK_REPO" ] && [ "$CALLBACK_REPO" != "none" ]; then
          if [ -n "$GH_TOKEN" ]; then
            echo "Dispatching test completion callback to $CALLBACK_REPO (ref: ${{ inputs.callback-ref }})..."
            gh workflow run callback \
              --repo "$CALLBACK_REPO" \
              --ref "${{ inputs.callback-ref }}" \
              --field commit-hash="${{ steps.check-out-code.outputs.commit }}" \
              --field release-branch="${{ github.ref_name }}" \
              --field release-repository="${{ github.repository }}" \
              --field result="${{ job.status == 'success' && 'tested' || 'test-failed' }}" \
              --field workflow-run-url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Callback dispatched successfully."
            echo "#### Callback Status: Dispatched" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Callback repo provided ($CALLBACK_REPO), but token missing. Skipping external callback."
            echo "#### Callback Status: Skipped (Token missing for \`$CALLBACK_REPO\`)" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "Standalone mode: No callback repository configured."
          echo "#### Standalone Mode Active" >> $GITHUB_STEP_SUMMARY
          echo "Tests verified successfully in repository \`${{ github.repository }}\`." >> $GITHUB_STEP_SUMMARY
        fi
    - name: "Upload Build System Reports"
      id: "upload-build-system-reports"
      if: "${{ !cancelled() }}"
      uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
      with:
        name: "build-system-reports"
        path: "**/build/reports"
        if-no-files-found: "ignore"
