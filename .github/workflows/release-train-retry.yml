# This file was adapted for forked repository support and dual-mode release train execution.

name: "Release Train – Retry"
run-name: "${{ inputs.release-train || 'Standalone' }} – Retry"
"on":
  workflow_dispatch:
    inputs:
      release-train:
        description: "Release train (train name or branch, e.g. 2026.0.0 or standalone)"
        required: false
        default: "standalone"
        type: "string"
      release-train-repository:
        default: "none"
        description: "Release train repository ('none' for standalone fork mode, or 'spring-io/release-train')"
        required: false
        type: "string"
      workflow-to-retry:
        description: "Workflow target for retry in standalone mode"
        options:
        - "Release Train – Build"
        - "Release Train – Test"
        - "Signal Only"
        default: "Signal Only"
        required: false
        type: "choice"
      auto-dispatch:
        description: "Automatically dispatch the target workflow (standalone mode)"
        required: false
        default: false
        type: boolean
permissions:
  contents: "read"
  actions: "write"
jobs:
  trigger-retry:
    name: "Trigger Retry"
    runs-on: ${{ vars.UBUNTU_MEDIUM || 'ubuntu-latest' }}
    steps:
    - name: "Retry"
      id: "retry"
      env:
        GH_TOKEN: "${{ secrets.RELEASE_TRAIN_PARTICIPANT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"
      run: |-
        TARGET_REPO="${{ inputs.release-train-repository }}"
        TRAIN_NAME="${{ inputs.release-train || 'standalone' }}"
        TARGET_WF="${{ inputs.workflow-to-retry || 'Signal Only' }}"
        AUTO_DISPATCH="${{ inputs.auto-dispatch }}"

        echo "### Release Train – Retry Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Release Train** | \`$TRAIN_NAME\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Release Repository** | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Release Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Target Workflow** | \`$TARGET_WF\` |" >> $GITHUB_STEP_SUMMARY

        # Check if external orchestrator mode is configured and token is present
        if [ "$TARGET_REPO" != "none" ] && [ -n "$TARGET_REPO" ] && [ "$TARGET_REPO" != "${{ github.repository }}" ]; then
          if [ -n "${{ secrets.RELEASE_TRAIN_PARTICIPANT_GITHUB_TOKEN }}" ]; then
            echo "Attempting external release train retry dispatch to $TARGET_REPO (ref: $TRAIN_NAME)..."
            run_url=$(
              gh workflow run retry \
              --repo "$TARGET_REPO" \
              --ref "$TRAIN_NAME" \
              --field release-branch="${{ github.ref_name }}" \
              --field release-repository="${{ github.repository }}" 2>&1
            ) || {
              echo "::warning::Failed to dispatch retry workflow in $TARGET_REPO: $run_url"
              echo "| **Mode** | External Dispatch Failed (Fell back to Standalone) |" >> $GITHUB_STEP_SUMMARY
              TARGET_REPO="none"
            }

            if [ "$TARGET_REPO" != "none" ]; then
              echo "Dispatched retry workflow run to $TARGET_REPO."
              echo "| **Mode** | External Orchestrator (\`$TARGET_REPO\`) |" >> $GITHUB_STEP_SUMMARY
              echo "| **Status** | Dispatched to \`$TARGET_REPO\` |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "::warning::External release train repository specified ($TARGET_REPO), but RELEASE_TRAIN_PARTICIPANT_GITHUB_TOKEN is missing. Activating Standalone mode."
            echo "| **Mode** | Standalone (Missing token for \`$TARGET_REPO\`) |" >> $GITHUB_STEP_SUMMARY
            TARGET_REPO="none"
          fi
        fi

        if [ "$TARGET_REPO" = "none" ] || [ -z "$TARGET_REPO" ] || [ "$TARGET_REPO" = "${{ github.repository }}" ]; then
          echo "Operating in Standalone / Fork Release Train Retry mode."
          echo "| **Mode** | Standalone / Fork Native Retry |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | \`Retry Registered\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Standalone Release Train Retry Active" >> $GITHUB_STEP_SUMMARY
          echo "A retry has been requested for project \`${{ github.repository }}\` on branch \`${{ github.ref_name }}\` for train \`$TRAIN_NAME\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$AUTO_DISPATCH" = "true" ] && [ "$TARGET_WF" != "Signal Only" ]; then
            echo "Auto-dispatch enabled. Triggering $TARGET_WF..."
            if [ "$TARGET_WF" = "Release Train – Build" ]; then
              gh workflow run "Release Train – Build" \
                --ref "${{ github.ref_name }}" \
                -f callback="none" \
                -f callback-ref="${{ github.ref_name }}" \
                -f repeat-build="false" || echo "::warning::Could not trigger Release Train – Build"
            elif [ "$TARGET_WF" = "Release Train – Test" ]; then
              gh workflow run "Release Train – Test" \
                --ref "${{ github.ref_name }}" \
                -f callback="none" \
                -f callback-ref="${{ github.ref_name }}" || echo "::warning::Could not trigger Release Train – Test"
            fi
            echo "- **Dispatched Workflow**: \`$TARGET_WF\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "#### Actionable Next Steps (Retry Links):" >> $GITHUB_STEP_SUMMARY
            echo "1. Run [Release Train – Build](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release-train-build.yml) to retry release artifact compilation." >> $GITHUB_STEP_SUMMARY
            echo "2. Run [Release Train – Test](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release-train-test.yml) to retry release train test suites." >> $GITHUB_STEP_SUMMARY
          fi

          # Generate retry manifest
          echo "{\"project\":\"spring-boot\",\"repository\":\"${{ github.repository }}\",\"branch\":\"${{ github.ref_name }}\",\"commit\":\"${{ github.sha }}\",\"release_train\":\"$TRAIN_NAME\",\"target_workflow\":\"$TARGET_WF\",\"retry_timestamp\":\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\",\"status\":\"retry_requested\"}" > release-train-manifest.json
        fi
    - name: "Upload Release Train Retry Manifest"
      id: "upload-release-train-manifest"
      uses: actions/upload-artifact@v4
      with:
        name: "release-train-retry"
        path: "release-train-manifest.json"
        if-no-files-found: "ignore"
