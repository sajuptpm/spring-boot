name: Create GitHub Release
description: 'Create the release on GitHub with a changelog'
inputs:
  commercial:
    description: 'Whether to generate the changelog for the commercial release'
    required: true
  latest:
    description: 'Whether the release is the latest release'
    required: false
    default: 'false'
  milestone:
    description: 'Name of the GitHub milestone for which a release will be created'
    required: true
  pre-release:
    description: 'Whether the release is a pre-release (a milestone or release candidate)'
    required: false
    default: 'false'
  edit:
    description: 'Whether to add or edit the release'
    default: 'false'
  token:
    description: 'Token to use for authentication with GitHub'
    required: true
runs:
  using: composite
  steps:
    - name: Generate Changelog
      uses: spring-io/github-changelog-generator@f7d7a87a3e7c627ecb8c26cf086c38ac5a939721 #v0.0.14
      with:
        config-file: ${{ (inputs.commercial == 'true' || inputs.commercial == true) && '.github/actions/create-github-release/changelog-generator-commercial.yml' || '.github/actions/create-github-release/changelog-generator-oss.yml' }}
        milestone: ${{ inputs.milestone }}
        token: ${{ inputs.token }}
    - name: Create or Update GitHub Release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        TAG="v${{ inputs.milestone }}"
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists. Updating release..."
          if [ "${{ inputs.pre-release }}" = "true" ]; then
            gh release edit "$TAG" --notes-file changelog.md --prerelease
          else
            gh release edit "$TAG" --notes-file changelog.md --prerelease=false --latest="${{ inputs.latest }}"
          fi
        else
          echo "Release $TAG does not exist. Creating release..."
          if [ "${{ inputs.pre-release }}" = "true" ]; then
            gh release create "$TAG" --verify-tag --notes-file changelog.md --prerelease
          else
            gh release create "$TAG" --verify-tag --notes-file changelog.md --latest="${{ inputs.latest }}"
          fi
        fi
